name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff==0.17.0
      - name: Lint (errors only)
        # The programme is closed and the code is the code the reported numbers
        # were measured on, so this gate checks for hard errors only (syntax
        # errors, undefined names, invalid comparisons) and does not reformat.
        run: ruff check --isolated --select E9,F63,F7,F82 .

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        # The corpus is not committed, so the 13 tests that need it skip here.
        # The other 36, including cache exactness and the causal-masking proof,
        # run on every push. See the Data availability section of README.md.
        run: python -m pytest tests/ -q
